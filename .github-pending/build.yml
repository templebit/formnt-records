# Goes in the records repo as .github/workflows/build.yml
#
# Rebuilds the published record site from government sources and publishes it to
# GitHub Pages. The repo holds this workflow, build_site.py, and the site itself
# under docs/.
#
# Pages on that repo is configured the legacy way — source main:/docs — so the
# site is committed rather than uploaded as an artifact. Pushing docs/ is what
# deploys; there is no deploy job. Switching to artifact deployment would mean
# flipping the Pages build type, and the site 404s between that flip and the
# first successful run, so it stays on /docs.
#
# One non-obvious thing: GitHub disables scheduled workflows on a repo after 60
# days with no commits. This job commits every run, which both keeps the
# schedule alive and leaves an audit trail of what was published when.

name: Build records

on:
  schedule:
    # Twice daily. The House archive is regenerated each morning US time and
    # EDGAR indexes update through the day.
    - cron: "0 12 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      allow_drop:
        description: "Publish even if the record count fell sharply"
        type: boolean
        default: false

permissions:
  contents: write      # committing docs/ is the deploy

concurrency:
  group: records
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pypdf

      # Be a good citizen with the source agencies: reuse the big quarterly
      # downloads instead of pulling them twice a day.
      - uses: actions/cache@v4
        with:
          path: Tools/.cache
          key: sources-${{ github.run_id }}
          restore-keys: sources-

      - name: Build
        env:
          # The SEC requires a descriptive User-Agent with a contact address and
          # returns 403 without one. Set FORMNT_UA as a repository variable.
          FORMNT_UA: ${{ vars.FORMNT_UA }}
          # Write over the live site, not into public/. Two reasons: docs/ is
          # what Pages serves, and the drop guard compares each build against
          # the meta.json already at this path — so it is checking against what
          # is actually published rather than against an empty directory.
          FORMNT_OUT: ${{ github.workspace }}/docs/v1
        run: |
          test -n "$FORMNT_UA" || { echo "FORMNT_UA repository variable is not set"; exit 1; }
          python3 Tools/build_site.py --limit 70 \
            ${{ inputs.allow_drop && '--allow-drop' || '' }}

      - name: Summarise
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open("docs/v1/meta.json"))
          print(f"### {m['records']} records\n")
          print(f"- built `{m['builtAt']}`")
          print(f"- SEC {m['secRecords']}, congressional {m['ogeRecords']}")
          print(f"- rules: {', '.join(m['rules'])}")
          EOF

      # Pushing docs/ is the deploy. The history copy is what keeps the
      # schedule from being auto-disabled on a quiet week, when the record set
      # can come back byte-identical and docs/ alone would leave nothing to
      # commit.
      - name: Publish
        run: |
          mkdir -p history
          cp docs/v1/meta.json "history/$(date -u +%Y-%m-%dT%H%M)Z.json"
          cp docs/v1/meta.json meta-latest.json
          git config user.name "records bot"
          git config user.email "noreply@templebit.com"
          git add docs history meta-latest.json
          git commit -m "records: $(python3 -c "import json;print(json.load(open('docs/v1/meta.json'))['records'])") records" || echo "nothing to commit"
          git push
